<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- ÉCRAN 1 : Saisie du pseudo -->
    <div id="login-screen" class="card">
      <h2>Mini WhatsApp</h2>
      <p>Entrez votre pseudo pour commencer</p>
      <input type="text" id="username-input" placeholder="Votre pseudo..." autocomplete="off">
      <button type="button" id="join-btn">Rejoindre le chat</button>
    </div>

    <!-- ÉCRAN 2 : Zone de discussion -->
    <div id="chat-screen" class="card" style="display: none;">
      <div class="chat-header">
        <h2>Discussion</h2>
        <span id="user-count">0 en ligne</span>
      </div>

      <div id="messages-container" class="messages-container"></div>

      <!-- FORMULAIRE DE MESSAGE -->
      <form id="chat-form">
        <input type="text" id="message-input" placeholder="Écrivez un message..." autocomplete="off" disabled>
        <button type="submit" id="send-btn" disabled>Envoyer</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
